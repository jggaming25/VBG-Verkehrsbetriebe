<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VBG Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <span class="brand-logo">🎫</span>
        <div>
          <div class="brand-name">VBG Bot</div>
          <div class="brand-sub">Dashboard v2.0</div>
        </div>
      </div>
      <div id="guildList" class="guild-list"></div>
      <div class="nav" id="nav"></div>
      <div class="foot">
        <div id="userInfo"></div>
        <a class="btn ghost sm" href="/auth/logout">↩️ Abmelden</a>
      </div>
    </aside>
    <main class="main" id="main"><div class="splash">Lade…<div class="spinner"></div></div></main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-back" id="modalBack" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
